<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 116" width="1200" height="116" role="img" aria-labelledby="title desc">
  <title id="title">Fivebar Linkage Studio workspace coverage</title>
  <desc id="desc">Three simulation cards: Reachable centres 64 of 64, Board area sampled 100 percent, and Farthest square 381 millimetres. Default example configuration.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7fb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-20%" width="110%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e4666" flood-opacity=".14"/>
    </filter>
  </defs>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <g filter="url(#shadow)" fill="url(#card)" stroke="#b5cadd" stroke-width="1.4">
      <rect x="7" y="7" width="379" height="98" rx="5"/>
      <rect x="410" y="7" width="379" height="98" rx="5"/>
      <rect x="813" y="7" width="380" height="98" rx="5"/>
    </g>
    <g fill="#5a7188" font-size="17" font-weight="500">
      <text x="27" y="39">Reachable centres</text>
      <text x="430" y="39">Board area sampled</text>
      <text x="833" y="39">Farthest square</text>
    </g>
    <text x="27" y="84" fill="#65d9b0" font-size="39" font-weight="750">64 / 64</text>
    <text x="430" y="84" fill="#27679c" font-size="39" font-weight="750">100%</text>
    <text x="833" y="84" fill="#27679c" font-size="39" font-weight="750">381 mm</text>
  </g>
</svg>