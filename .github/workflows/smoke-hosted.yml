name: Smoke test hosted simulator

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/smoke-hosted.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node .github/scripts/smoke-hosted.cjs
